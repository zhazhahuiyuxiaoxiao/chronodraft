name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npx --yes electron-builder@26.15.3 --mac dmg zip --x64 --arm64 --publish never
          - os: windows-latest
            command: npx --yes electron-builder@26.15.3 --win nsis --x64 --publish never
          - os: ubuntu-latest
            command: npx --yes electron-builder@26.15.3 --linux AppImage --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ChronoDraft-${{ runner.os }}
          path: release/*
          if-no-files-found: error
