name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag that receives the installers
        required: true
        default: v0.1.1
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  prepare-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ChronoDraft $RELEASE_TAG" \
              --prerelease \
              --notes "早期预览版。v0.1.1 修复了 macOS 安装包被提示“已损坏”的问题。安装包尚未进行付费开发者签名，请先阅读 README 中的安装说明。"
          fi

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npx --yes electron-builder@26.15.3 --mac dmg zip --x64 --arm64 --publish never
            release_files: release/*.dmg release/*.zip
          - os: windows-latest
            command: npx --yes electron-builder@26.15.3 --win nsis --x64 --publish never
            release_files: release/*.exe
          - os: ubuntu-latest
            command: npx --yes electron-builder@26.15.3 --linux AppImage --x64 --publish never
            release_files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify macOS app signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find release -maxdepth 2 -type d -name "ChronoDraft.app" -print0 |
            while IFS= read -r -d '' app; do
              codesign --verify --deep --strict --verbose=4 "$app"
            done
      - uses: actions/upload-artifact@v7
        with:
          name: ChronoDraft-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
      - name: Add installers to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" ${{ matrix.release_files }} --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: installers
          merge-multiple: true
      - name: Create SHA-256 checksums
        working-directory: installers
        run: find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Add checksums to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" installers/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
